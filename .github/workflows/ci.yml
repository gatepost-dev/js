name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The oldest Python that the scripts in the spec repo support.
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pnpm check starts reuse and zizmor with uvx. The tools are small, and no lock file
          # keys a cache.
          enable-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The tests of the field run in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check

  node-22:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checks read each commit from the base to the head.
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from "$BASE" --to "$HEAD"
      - name: Check each commit message for agent tells
        run: |
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            python3 spec/scripts/check-tells --commit-msg "$RUNNER_TEMP/message"
          done

  licences:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks must read the whole history.
          fetch-depth: 0
          persist-credentials: false
      - run: |
          image=ghcr.io/gitleaks/gitleaks # v8.30.1
          digest=sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          docker run --rm -v "$PWD:/repo" "$image@$digest" git /repo

  # The job builds the image of the mock server and calls it once. It never pushes the image.
  # mock-release.yml publishes it.
  mock-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: docker build --file packages/mock-server/Dockerfile --tag postcode-mock:ci .
      - name: Start the image and look up the synthetic unit
        run: |
          # The key comes from the key table that the mock server reads, so no key is in this file.
          key="$(jq --raw-output '.keys[] | select(.lookupLevel == 1 and .kind == "secret"
            and .lookupScope and .credits and (.rateLimited | not)) | .key' \
            spec/fixtures/keys.json | head --lines=1)"
          docker run --detach --name mock --publish 4010:4010 postcode-mock:ci
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 1 \
            http://localhost:4010/healthz
          curl --silent --show-error --fail-with-body --header "X-API-Key: $key" \
            'http://localhost:4010/v1/lookup?code=FC-01-Z99-ZZ-01' | tee "$RUNNER_TEMP/lookup.json"
          grep --quiet '"valid":true' "$RUNNER_TEMP/lookup.json"
      - if: always()
        run: docker logs mock

name: mock release

# Publishes the image of the mock server to the GitHub container registry, with a provenance
# attestation (SEC-7). A pushed image is public, so the workflow starts only for a tag such as
# postcode-mock-v0.1.0, or when a maintainer starts it by hand. No other event starts it.
on:
  push:
    tags: ['postcode-mock-v*']
  workflow_dispatch:
    inputs:
      version:
        description: The version of the image, such as 0.1.0. It must match package.json.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mock-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/gatepost-dev/postcode-mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      # The tag or the input gives the version. It must match package.json, so that the image
      # and the source in the repo agree.
      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#postcode-mock-v}}"
          declared="$(jq --raw-output .version packages/mock-server/package.json)"
          if [ "$version" != "$declared" ]; then
            echo "The version is $version, but package.json says $declared." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/mock-server/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
